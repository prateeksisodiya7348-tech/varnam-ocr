# Render Blueprint - creates the database and the API.
#
# The API also serves the built frontend from `/`, so there is exactly ONE public
# URL and no cross-origin configuration to get wrong:
#
#   https://varnam-ocr-api.onrender.com/app   <- the app
#   https://varnam-ocr-api.onrender.com/v1/ocr
#
# An earlier revision also declared a separate static site for the frontend. That
# introduced a second build pipeline, a second hostname, and a CORS dependency
# between them - and its blueprint sync failed. One deployable is fewer moving
# parts on a free tier.
#
# Free-tier reality, encoded here rather than in a wiki nobody reads:
#   * 512 MB RAM -> one uvicorn worker, one ORT thread, float32 model (16 MB).
#   * sleeps after ~15 min idle -> /health/ready gates traffic while it boots.
#   * no persistent disk -> uploads vanish on redeploy; results live in Postgres.
#   * free Postgres expires after 30 days unless upgraded - see docs/LIMITATIONS.md.

databases:
  - name: varnam-ocr-db
    databaseName: varnam
    user: varnam
    plan: free
    region: singapore

services:
  - type: web
    name: varnam-ocr-api
    runtime: docker
    plan: free
    region: singapore
    # Build context must be the repo root: the image needs services/api, the
    # shared packages/devanagari_text, and apps/web (built in a Node stage).
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: VARNAM_ENGINE
        value: auto
      - key: MODEL_DIR
        value: /app/models
      - key: ORT_INTRA_OP_THREADS
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_IMAGE_LONG_EDGE
        value: "2000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: STORAGE_BACKEND
        value: local
      # Injected by Render from the database above - never copied by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: varnam-ocr-db
          property: connectionString
      # The UI is served from this same origin, so the only extra origin needed
      # is the local dev server.
      - key: CORS_ORIGINS
        value: http://localhost:3000
