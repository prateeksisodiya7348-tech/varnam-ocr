# Render Blueprint - creates the database, the API, and the static frontend.
#
# Goal: a deploy needs ZERO manually copied secrets or URLs.
#   * Postgres is provisioned here and injected into DATABASE_URL.
#   * Both public hostnames are derived from the service names, so the API can
#     allow the frontend origin and the frontend can point at the API without
#     anyone copy-pasting anything.
#
# Free-tier reality, encoded here rather than in a wiki nobody reads:
#   * 512 MB RAM -> one uvicorn worker, one ORT thread, float32 model (16 MB).
#   * sleeps after ~15 min idle -> /health/ready gates traffic while it boots.
#   * no persistent disk -> uploads live on local disk and vanish on redeploy.
#     OCR results are in Postgres, so the app keeps working.
#   * free Postgres expires after 30 days unless upgraded - see docs/LIMITATIONS.md.

databases:
  - name: varnam-ocr-db
    databaseName: varnam
    user: varnam
    plan: free
    region: singapore

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: varnam-ocr-api
    runtime: docker
    plan: free
    region: singapore
    # Build context must be the repo root: the image needs both services/api and
    # the shared packages/devanagari_text directory.
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: VARNAM_ENGINE
        value: auto
      - key: MODEL_DIR
        value: /app/models
      - key: ORT_INTRA_OP_THREADS
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_IMAGE_LONG_EDGE
        value: "2000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: STORAGE_BACKEND
        value: local
      # Injected by Render from the database above - never copied by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: varnam-ocr-db
          property: connectionString
      # Both origins are known up front, so CORS needs no post-deploy step.
      # The static site's hostname is derived from its service name below.
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://varnam-ocr-web.onrender.com

  # --------------------------------------------------------------- frontend
  - type: web
    name: varnam-ocr-web
    runtime: static
    # NEXT_OUTPUT=export switches next.config.ts to a fully static `out/` build;
    # static hosting cannot run Next's middleware or header pipeline.
    buildCommand: pnpm install && NEXT_OUTPUT=export pnpm --filter @varnam/web build
    staticPublishPath: ./apps/web/out
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://varnam-ocr-api.onrender.com
