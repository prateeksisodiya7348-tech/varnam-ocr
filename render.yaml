# Render Blueprint - creates the database AND the API in one click.
#
# The point of this file is that a deploy needs NO manually copied secrets:
# Render provisions the Postgres instance and injects its connection string into
# DATABASE_URL via `fromDatabase`. The only variable left to change by hand is
# CORS_ORIGINS, and only after the frontend exists.
#
# Free-tier reality, encoded here rather than in a wiki nobody reads:
#   * 512 MB RAM -> one uvicorn worker, one ORT thread, float32 model (16 MB).
#   * sleeps after ~15 min idle -> /health/ready gates traffic while it boots.
#   * no persistent disk -> uploads live on local disk and vanish on redeploy.
#     OCR results are in Postgres, so the app keeps working.
#   * free Postgres expires after 30 days unless upgraded - see docs/LIMITATIONS.md.

databases:
  - name: varnam-ocr-db
    databaseName: varnam
    user: varnam
    plan: free
    region: singapore

services:
  - type: web
    name: varnam-ocr-api
    runtime: docker
    plan: free
    region: singapore
    # Build context must be the repo root: the image needs both services/api and
    # the shared packages/devanagari_text directory.
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: VARNAM_ENGINE
        value: auto
      - key: MODEL_DIR
        value: /app/models
      - key: ORT_INTRA_OP_THREADS
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_IMAGE_LONG_EDGE
        value: "2000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: STORAGE_BACKEND
        value: local
      # Injected by Render from the database above - never copied by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: varnam-ocr-db
          property: connectionString
      # Replace with the Vercel URL after the frontend is deployed.
      - key: CORS_ORIGINS
        value: http://localhost:3000
