[project]
name = "varnam-api"
version = "1.0.0"
description = "Devanagari OCR API - FastAPI + ONNX Runtime"
requires-python = ">=3.11"
# Dependencies intentionally live in requirements.txt (see the header there for
# why). This file exists for tool configuration and package metadata only.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = [
  "PLR0913",  # FastAPI handlers legitimately take several injected params
  "PLR2004",  # magic numbers in tests are clearer inline
  "B008",     # Depends() in defaults is the documented FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "pypdfium2.*", "boto3.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# `../..` puts the repository root on sys.path; `../../packages` is what makes
# `import devanagari_text` resolve without installing it. The Docker image does
# the same thing via ENV PYTHONPATH, so tests and production agree.
pythonpath = [".", "../..", "../../packages"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Escalate deprecations from OUR modules only. A blanket `error::DeprecationWarning`
# breaks the suite whenever a third-party package (anyio, starlette) deprecates
# something internally - which is noise, not our bug.
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app", "../../packages"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
